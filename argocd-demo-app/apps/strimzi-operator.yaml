apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.50.0
    helm:
      releaseName: strimzi-cluster-operator
      valuesObject:
        watchNamespaces:
          - messaging
        nodeSelector:
          kubernetes.io/hostname: ubuntu-yuksum
        env:
          - name: KUBERNETES_HTTP2_DISABLE
            value: "true"
          - name: KUBERNETES_REQUEST_TIMEOUT
            value: "30000"
          - name: KUBERNETES_CONNECTION_TIMEOUT
            value: "30000"
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 1000m
        livenessProbe:
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true