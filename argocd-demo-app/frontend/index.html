<div class="card">
    <h1>ArgoCD + Kafka + Keycloak</h1>
    <div id="user-info" class="user-bar">Authenticating...</div>
    <div class="actions">
      <button id="btn-publish" class="secondary" disabled>1. Publish Event</button>
      <button id="btn-fetch" disabled>2. Fetch Events</button>
      <button id="btn-logout" class="logout" disabled>Logout</button>
    </div>
    <div id="output" class="status">Waiting for login...</div>
  </div>

  <script type="module">
    import Keycloak from '/keycloak.js';

    const keycloak = new Keycloak({
      url: 'http://keycloak.local:8080',
      realm: 'argocd-demo',
      clientId: 'demo-frontend'
    });

    async function authFetch(url, options = {}) {
      await keycloak.updateToken(30);
      options.headers = {
        ...options.headers,
        'Authorization': 'Bearer ' + keycloak.token
      };
      return fetch(url, options);
    }

    async function publishEvent() {
      const output = document.getElementById('output');
      try {
        const text = `Message #${Math.floor(Math.random() * 1000)}`;
        const res = await authFetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (!res.ok) {
          output.innerText = `Error ${res.status}: ${await res.text()}`;
          return;
        }
        const data = await res.json();
        output.innerText = `Published: "${data.event}"`;
      } catch (err) {
        output.innerText = err.message;
      }
    }

    async function fetchData() {
      const output = document.getElementById('output');
      try {
        const res = await authFetch('/api/data');
        if (!res.ok) {
          output.innerText = `Error ${res.status}: ${await res.text()}`;
          return;
        }
        const data = await res.json();
        const events = (data.recent_messages || []).map(m => `• ${m}`).join('<br>') || 'No messages yet';
        output.innerHTML = `<strong>User:</strong> ${data.user}<br><strong>Pod:</strong> ${data.host}<br><strong>Events:</strong><br>${events}`;
      } catch (err) {
        output.innerText = err.message;
      }
    }

    document.getElementById('btn-publish').addEventListener('click', publishEvent);
    document.getElementById('btn-fetch').addEventListener('click', fetchData);
    document.getElementById('btn-logout').addEventListener('click', () => keycloak.logout());

    keycloak.init({ onLoad: 'login-required', checkLoginIframe: false })
      .then(authenticated => {
        if (authenticated) {
          document.getElementById('user-info').innerText =
            `Logged in as: ${keycloak.tokenParsed.preferred_username}`;
          document.getElementById('output').innerText = 'Authenticated! Ready to publish or fetch.';
          document.getElementById('btn-publish').disabled = false;
          document.getElementById('btn-fetch').disabled = false;
          document.getElementById('btn-logout').disabled = false;
        }
      })
      .catch(err => {
        document.getElementById('output').innerText = 'Keycloak init failed: ' + JSON.stringify(err);
      });
  </script>
