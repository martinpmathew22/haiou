apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: harbor.local/tang/backend:v1.0.0
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        env:
        - name: KEYCLOAK_ISSUER_URL
          value: "http://keycloak.local:8080/realms/argocd-demo"
        - name: KAFKA_BROKER
          value: "my-cluster-kafka-bootstrap.messaging.svc.cluster.local:9092"
        - name: KAFKA_TOPIC
          value: "demo-events"
        - name: REDIS_ADDR
          value: "redis-service.messaging.svc.cluster.local:6379"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq-service.messaging.svc.cluster.local:5672/"                
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# k8s/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  labels:
    release: kube-prometheus-stack # Match your Prometheus operator release label
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
