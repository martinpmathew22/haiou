---
# ==========================================
# 0. Namespace & Secrets
# ==========================================
apiVersion: v1
kind: Namespace
metadata:
  name: tuzi
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: tuzi
type: Opaque
stringData:
  POSTGRES_DB: "appdb"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "adminpassword"
---


